<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/framework.css" />
    <link rel="stylesheet" href="css/master.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500&#038;display=swap" rel="stylesheet" />
</head>

<body>
    <div class="page d-flex">
        <div class="sidebar bg-white p-20 p-relative">
            <h3 class="p-relative mt-0 txt-c">Beshir</h3>
            <ul>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="index.html">
                        <i class="fa-solid fa-chart-bar fa-fw"></i>
                        <span class="ml-10">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a class="active d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="settings.html">
                        <i class="fa-solid fa-gear"></i>
                        <span class="ml-10">Settings</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="index.html">
                        <i class="fa-regular fa-user"></i>
                        <span class="ml-10">Profile</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="index.html">
                        <i class="fa-solid fa-diagram-project"></i>
                        <span class="ml-10">Projects</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="index.html">
                        <i class="fa-solid fa-graduation-cap fa-fw"></i>
                        <span class="ml-10">Courses</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="index.html">
                        <i class="fa-regular fa-circle-user"></i>
                        <span class="ml-10">Friends</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="index.html">
                        <i class="fa-regular fa-file"></i>
                        <span class="ml-10">Files</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex align-center fs-14 c-black rad-6 p-10 mb-5" href="index.html">
                        <i class="fa-regular fa-credit-card"></i>
                        <span class="ml-10">Plans</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="content w-full">
            <div class="header p-20 bg-white d-flex between-flex">
                <div class="search p-relative">
                    <input type="search" class="p-10" placeholder="Type A Keyword">
                </div>
                <div class="icons d-flex align-center">
                    <span class="notification p-relative">
                        <i class="fa-regular fa-bell"></i>
                    </span>
                    <img src="Images/avatar.png" alt="">
                </div>
            </div>

            <h1 class="p-relative">Settings</h1>

            <div class="settings-page d-grid gap-20 m-20">
                <div class="site-control bg-white p-20 rad-10">
                    <h2 class="m-0">Site Control</h2>
                    <p class="c-gray mt-10 fs-15 m-0 mb-15">Control The Website If There Is Maintenance</p>

                    <div class="between-flex">
                        <div>
                            <span>Website Control</span>
                            <p class="c-gray fs-13 mt-5">Open/Close Website And Type The Reason</p>
                        </div>
                        <div>
                            <label></label>
                        </div>
                    </div>

                    <textarea class="close-message p-10 rad-6 d-block w-full" placeholder="Close Message Content"></textarea>
                </div>
                <div class="general-info bg-white p-20 rad-10">
                    <h2 class="m-0">General Info</h2>
                    <p class="c-gray mt-10 fs-15 m-0 mb-15">General Information About Your Account</p>
                     <div class="mb-15">
                        <label class="mb-10 c-gray d-block fs-14">First Name</label>
                        <input class="rad-6 p-10 border-ccc d-block w-full" id="first" type="text" placeholder="First Name"></input>
                     </div>
                     <div class="mb-15">
                        <label class="mb-10 c-gray d-block fs-14">Last Name</label>
                        <input class="rad-6 p-10 border-ccc d-block w-full" id="last" type="text" placeholder="Last Name"></input>
                     </div>
                     <div>
                        <label class="mb-10 c-gray d-block fs-14">Email</label>
                        <input class="email rad-6 p-10 border-ccc d-block w-full mr-10" id="last" type="text" placeholder="hassan@beshir.com" disabled fdprocessedid="mmsop" ></input>
                        <a class="c-blue" href="#">Change</a>
                     </div>
                </div>
            </div>
        </div>
</body>

</html>
